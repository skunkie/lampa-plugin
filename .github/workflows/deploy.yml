name: Deploy Plugin to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Target channel ('dev' or 'release')"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - release
      version:
        description: "Version override (required for release if no tag)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve deployment mode and version
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.channel }}"
            version="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            mode="release"
            version="${GITHUB_REF_NAME#v}"
          else
            mode="dev"
            version=""
          fi

          if [ "$mode" = "release" ]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release version '$version' (expected SemVer, e.g. 1.2.3)"
              exit 1
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_release=$([ "$mode" = "release" ] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test and coverage
        run: npm run coverage

      - name: Build Pages Site
        run: |
          ARGS="--mode ${{ steps.mode.outputs.mode }} --outdir dist-pages"
          if [ -n "${{ steps.mode.outputs.version }}" ]; then
            ARGS="$ARGS --version ${{ steps.mode.outputs.version }}"
          fi
          node build-pages.mjs $ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Upload bundle artifacts
        if: steps.mode.outputs.is_release == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: |
            dist-pages/torrplay.js
            dist-pages/torrplay.js.map
            dist-pages/torrplay.min.js

  changelog:
    name: Generate Changelog
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  create-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-deploy, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          name: ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.release_body }}
          make_latest: true
